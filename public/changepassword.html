<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TEAMTASK | Set Password</title>

    <link rel="stylesheet" href="changepassword.css">
</head>

<body>

    <header class="topbar">
        <div class="brand">TEAMTASK</div>
    </header>

    <main class="page">

        <section class="password-card">

            <div class="icon-box">
                🔐
            </div>

            <h1>Set Your Password</h1>

            <p class="subtitle">
                Your TEAMTASK account has been created.
                Set a secure password to activate your account.
            </p>

            <form id="passwordForm">

                <div class="form-group">
                    <label for="password">New Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >
                </div>
                <p id="passwordError"></p>

                <div class="password-rules">
                    <span>Password should be at least 8 characters</span>
                </div>

                <button type="submit" id="activateButton">
                    Activate Account
                </button>

            </form>

            <p id="message"></p>

            <div class="security-note">
                <span>🔒</span>
                <p>Your password is securely protected by TEAMTASK.</p>
            </div>

        </section>

    </main>

    <footer>
        © 2026 TEAMTASK · Secure Employee Workspace
    </footer>

    <script src="changepassword.js"></script>

</body>
</html>
