<!DOCTYPE html>
<html>
<head>
    <title>TicketFlow</title>
    <link rel="stylesheet" href="developer.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">T</div>
            <h1>TICKETFLOW</h1>
        </div>

        <nav class="sidebar-items">

            <a href="#" id="home" class="nav-link active">
                <span class="nav-icon">⌂</span>
                <span>Home</span>
            </a>

            <a href="#" id="tickets" class="nav-link">
                <span class="nav-icon">▣</span>
                <span>Tickets</span>
            </a>

            <a href="#" id="claimedtickets" class="nav-link">
                <span class="nav-icon">✓</span>
                <span>Claimed Tickets</span>
            </a>

            <a href="#" id="settings" class="nav-link">
                <span class="nav-icon">⚙</span>
                <span>Settings</span>
            </a>

        </nav>

        <div class="bottom">
            <a href="index.html" class="logout">
                <span class="nav-icon">↪</span>
                <span>Logout</span>
            </a>
        </div>

    </aside>

    <header class="topbar">

        <div class="profile">

            <div class="profile-info">
                <label>Employee ID</label>
                <input type="text" id="userId" readonly>
            </div>

            <div class="profile-info">
                <label>Email</label>
                <input type="email" id="email" readonly>
            </div>

            <div class="avatar">
                <span>👤</span>
            </div>

        </div>

    </header>

    <main class="maincontent" id="mainContent">

        <div class="welcome">
            <p class="welcome-small">Developer Dashboard</p>
            <h1>WELCOME <span id="username"></span></h1>
            <p class="welcome-text">
                Manage your assigned tickets and track your work.
            </p>
        </div>

    </main>

</div>
<script src="https://unpkg.com/lucide@latest"></script>
 <script>
        lucide.createIcons();
    </script>
    <script src="/socket.io/socket.io.js"></script>

<script src="developer.js"></script>

</body>
</html>
